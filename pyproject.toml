[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-ocr-assistant"
version = "0.2.0"
description = "Kylin, Windows, and macOS offline desktop OCR client"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Document OCR Assistant" }]
dependencies = [
  "PySide6==6.8.3",
  "rapidocr==3.9.1",
  "onnxruntime==1.23.2",
  "PyMuPDF==1.26.7",
  "Pillow==12.1.0",
  "numpy==2.2.6",
  "opencv-python==4.13.0.90",
  "rarfile==4.2",
  "py7zr==1.1.3",
  "python-xlib==0.33; platform_system == 'Linux'",
  "pywin32==311; platform_system == 'Windows'",
]

[project.optional-dependencies]
table = [
  "rapid-table==3.0.2",
]
build = [
  "pyinstaller==6.18.0",
  "pyinstaller-hooks-contrib==2026.0",
]
test = ["pytest>=7.4,<9"]

[project.scripts]
document-ocr-assistant = "document_ocr_assistant.__main__:main"
document-ocr-cli = "document_ocr_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
